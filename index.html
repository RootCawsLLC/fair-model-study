<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAIR Taxonomy Drill — walk the tree, rebuild it, match every definition</title>
  <meta name="description" content="A study drill for the FAIR risk taxonomy: walk the factor tree with the units on, rebuild it from a shuffled pool with them off, and match all twenty-two definitions to their names. Load a source-backed loss benchmark to see how little of the tree published data ever fills. A RootCaws LLC risk lab tool." />
  <meta name="author" content="RootCaws LLC" />
  <meta name="robots" content="noindex, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="FAIR Taxonomy Drill" />
  <meta property="og:description" content="Walk the FAIR factor tree, rebuild it from memory, match every definition." />
  <meta property="og:site_name" content="RootCaws LLC · Risk Lab" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      color-scheme:light;
      --paper:#f7ebed;--paper-2:#f0dee0;--panel:#ffffff;
      --ink:#3a3336;--ink-2:#4d4548;--muted:#7a7073;
      --line:#d8c9cc;--soft-line:rgba(58,51,54,.08);
      --rose:#8d5860;--rose-2:#c7848d;--rose-soft:#f4dcdf;
      --sage:#4c7359;--sage-soft:#e2eee6;
      --amber:#9a6a24;--amber-soft:#f7e9d4;
      --plum:#6f5b86;--plum-soft:#ece7f2;
      --brick:#b0474f;--brick-soft:#f6e0e1;
      --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --display:'Fraunces',Georgia,serif;
      --shadow:0 10px 26px rgba(58,51,54,.07);
      --radius:14px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-width:320px;line-height:1.5}
    ::selection{background:var(--rose-soft)}
    a{color:var(--rose)}
    button,input,select{font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:4px}
    .wrap{max-width:1400px;margin:0 auto;padding:0 24px}
    @media (max-width:767px){.wrap{padding:0 16px}}

    .masthead{padding-top:48px;padding-bottom:28px;border-bottom:1px solid var(--soft-line)}
    .kicker{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
    .masthead h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,4.6vw,56px);line-height:1.02;letter-spacing:-.02em;margin:10px 0 14px}
    .masthead h1 em{font-style:italic;color:var(--rose)}
    .deck{font-size:17px;color:var(--ink-2);line-height:1.6}

    .bench{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:20px;align-items:start;padding-top:24px}
    @media (max-width:1099px){.bench{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .controls{position:sticky;top:16px;padding:18px}
    @media (max-width:1099px){.controls{position:static}}
    .label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .rule{height:1px;background:var(--soft-line);margin:16px 0}
    .modes{display:grid;gap:6px;margin-top:8px}
    .modes button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .12s,background .12s}
    .modes button:hover{border-color:var(--rose)}
    .modes button.on{background:var(--rose-soft);border-color:var(--rose)}
    .modes b{display:block;font-size:13.5px}
    .modes span{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
    .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
    .seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
    .seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(58,51,54,.12)}
    .seg button[disabled]{opacity:.5;cursor:default}
    .progress{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .progress .cell{padding:10px 12px;border-radius:10px;background:var(--paper)}
    .progress .v{font-family:var(--display);font-weight:600;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
    .progress .k{font-size:11px;color:var(--muted);margin-top:4px}
    .legend{display:grid;gap:6px}
    .legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
    .btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--rose);background:var(--rose);color:#fff;transition:background .12s,border-color .12s,color .12s;white-space:nowrap}
    .btn:hover{background:var(--ink);border-color:var(--ink)}
    .btn.ghost{background:transparent;color:var(--rose)}
    .btn.ghost:hover{background:var(--rose-soft);border-color:var(--rose);color:var(--rose)}
    .btn.small{padding:6px 12px;font-size:12px}
    select.field{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink)}
    select.field:focus{border-color:var(--rose);outline:none}

    .panel{padding:16px 18px 18px;margin-bottom:16px}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
    .panel-head h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
    .lede{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:12px}
    .status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px;font-weight:600;color:var(--ink-2);min-height:30px;margin-bottom:10px}
    .status.good{color:var(--sage)}
    .status.hot{color:var(--rose)}

    /* unit badges, HTML flavour */
    .unit{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;border:2px solid;flex-shrink:0}
    .unit.money{color:var(--sage);border-color:var(--sage);background:var(--sage-soft)}
    .unit.prob{color:var(--plum);border-color:var(--plum);background:var(--plum-soft)}
    .unit.freq{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
    .unit.ask{color:var(--rose);border-color:var(--rose);background:var(--rose-soft);border-style:dashed}
    .ask-units{display:inline-flex;gap:6px;align-items:center}
    .ask-units button{width:32px;height:32px;border-radius:50%;border:2px solid;font-weight:700;font-size:13px;cursor:pointer;background:var(--panel);transition:transform .1s}
    .ask-units button.money{color:var(--sage);border-color:var(--sage)}
    .ask-units button.prob{color:var(--plum);border-color:var(--plum)}
    .ask-units button.freq{color:var(--amber);border-color:var(--amber)}
    .ask-units button:hover{transform:scale(1.08)}

    /* the diagram */
    .diagram{display:block;width:100%;height:auto;overflow:visible;margin:6px 0 4px}
    .diagram text{font-family:var(--ui);pointer-events:none}
    .diagram .edge{fill:none;stroke:var(--line);stroke-width:2}
    .gnode rect.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;transition:stroke .15s,fill .15s}
    .gnode text.abbr{font-family:var(--display);font-weight:700;font-size:17px;fill:var(--ink)}
    .gnode text.nm{font-size:10px;fill:var(--ink-2)}
    .diagram.tight .gnode text.abbr{font-size:14px}
    .gnode text.dots{font-size:13px;letter-spacing:.2em;fill:var(--muted)}
    .gnode.clickable{cursor:pointer}
    .gnode.clickable:hover rect.box{stroke:var(--rose)}
    .gnode.sel rect.box{stroke:var(--rose);stroke-width:2;fill:var(--rose-soft)}
    .gnode.sourced rect.box{stroke:var(--amber);fill:var(--amber-soft)}
    .gnode.slot rect.box{fill:transparent;stroke-dasharray:5 4}
    .gnode.armed rect.box{stroke:var(--rose)}
    .gnode.armed:hover rect.box{fill:var(--rose-soft)}
    .gnode.placed rect.box{stroke:var(--rose)}
    .gnode.done rect.box{stroke:var(--sage)}
    .gnode.good rect.box{stroke:var(--sage);fill:var(--sage-soft)}
    .gnode.bad{animation:shake .35s ease-out;transform-box:fill-box}
    .gnode.bad rect.box{stroke:var(--brick);fill:var(--brick-soft)}
    .ubadge circle{stroke-width:2}
    .ubadge text{font-size:11px;font-weight:700}
    .ubadge.money circle{fill:var(--sage-soft);stroke:var(--sage)} .ubadge.money text{fill:var(--sage)}
    .ubadge.prob circle{fill:var(--plum-soft);stroke:var(--plum)} .ubadge.prob text{fill:var(--plum)}
    .ubadge.freq circle{fill:var(--amber-soft);stroke:var(--amber)} .ubadge.freq text{fill:var(--amber)}
    .ubadge.ask circle{fill:var(--rose-soft);stroke:var(--rose);stroke-dasharray:3 2} .ubadge.ask text{fill:var(--rose)}
    .gnode text.tag{font-size:9px;font-weight:700;letter-spacing:.08em;fill:var(--amber)}
    @keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
    @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}

    /* detail strip under the diagram */
    .detail{margin-top:8px;padding:14px 16px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
    .detail .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
    .detail .abbr{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
    .detail .nm{font-size:14px;color:var(--ink-2)}
    .detail .aka{font-size:12px;color:var(--muted)}
    .detail .ulab{font-size:11.5px;color:var(--muted);margin-left:auto}
    .detail p{font-size:14px;color:var(--ink-2);line-height:1.6}
    .detail .src{margin-top:8px;font-size:12.5px;color:var(--amber);font-weight:600}
    .detail .kids{margin-top:8px;font-size:12px;color:var(--muted)}
    .detail .kids b{color:var(--ink-2);font-weight:600}

    /* the outline view */
    .tree,.tree ul{list-style:none}
    .tree ul{margin-left:14px;padding-left:18px;border-left:2px solid var(--line)}
    .tree li{position:relative;padding:4px 0}
    .tree ul>li::before{content:"";position:absolute;left:-18px;top:24px;width:14px;height:2px;background:var(--line)}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);min-height:42px;transition:border-color .15s,box-shadow .15s}
    .row .abbr{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em}
    .row .nm{font-size:13px;color:var(--ink-2)}
    .row .aka{font-size:11.5px;color:var(--muted)}
    .row .def{flex-basis:100%;font-size:12.5px;color:var(--muted);line-height:1.5}
    .row .src{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
    .row.sourced{border-color:var(--amber)}
    .row.slot{border-style:dashed;background:transparent;color:var(--muted);letter-spacing:.2em;justify-content:center;min-width:120px}
    .row.slot.armed{cursor:pointer;border-color:var(--rose)}
    .row.slot.armed:hover{background:var(--rose-soft)}
    .row.placed{border-color:var(--rose)}
    .row.done{border-color:var(--sage)}
    .row.good{animation:pop .35s ease-out;border-color:var(--sage)}
    .row.bad{animation:shake .35s ease-out;border-color:var(--brick)}
    .row .ask-units{margin-left:auto}
    .row .ask-units span{font-size:11.5px;color:var(--rose);font-weight:600;margin-right:2px}

    .pool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:10px;background:var(--paper);margin-bottom:14px}
    .chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s}
    .chip:hover{border-color:var(--rose)}
    .chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
    .chip small{font-weight:500;color:var(--muted);margin-left:5px}
    .chip.on small{color:rgba(255,255,255,.8)}
    .pool .empty{font-size:12.5px;color:var(--muted)}

    .match{display:grid;grid-template-columns:minmax(170px,1fr) minmax(0,2.2fr);gap:14px;align-items:start}
    @media (max-width:767px){.match{grid-template-columns:1fr}}
    .names{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px}
    @media (max-width:767px){.names{position:static;flex-direction:row;flex-wrap:wrap}}
    .names .chip{text-align:left}
    .defs{display:grid;gap:8px}
    .defcard{padding:10px 14px;border-radius:10px;border:1px dashed var(--line);cursor:pointer;transition:border-color .15s,background .15s}
    .defcard:hover{border-color:var(--rose)}
    .defcard.matched{border-style:solid;background:var(--panel);cursor:default;border-left-width:3px}
    .defcard.good{animation:pop .35s ease-out}
    .defcard.bad{animation:shake .35s ease-out;border-color:var(--brick)}
    .defcard .who{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12.5px;font-weight:700}
    .defcard .cat{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
    .defcard .txt{font-family:var(--display);font-style:italic;font-size:14px;color:var(--ink-2);line-height:1.5}
    .example{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--amber-soft);border-left:3px solid var(--amber);font-size:13px;line-height:1.6;color:var(--ink-2)}
    .example b{color:var(--amber)}
    details.sources{margin-top:8px}
    details.sources summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);font-weight:600}
    details.sources ul{margin:8px 0 0 16px}
    details.sources li{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:8px}
    .finish{margin-top:14px;padding:16px;border-radius:10px;background:var(--sage-soft);border-left:3px solid var(--sage);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .finish b{font-family:var(--display);font-size:18px;font-weight:600}
    .finish span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}

    .notes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-top:28px;padding-bottom:80px}
    .notes::before{content:"Notes";grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--soft-line)}
    .note{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
    @media (max-width:899px){.notes{grid-template-columns:1fr}}
    .note h3{font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:8px;letter-spacing:-.01em}
    .note p{font-size:14px;color:var(--ink-2);line-height:1.65}
    .notes.embedded{padding-top:8px;padding-bottom:24px}
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.row.good,.row.bad,.defcard.good,.defcard.bad,.gnode.bad{animation:none}}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script>
  'use strict';
  const {useState,useEffect,useMemo,useRef,createElement:el}=React;

  // The portfolio risk lab renders this page inside an iframe and supplies its
  // own heading, so the masthead is dropped when we are not the top window.
  const EMBEDDED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
  const BENCHMARKS_URL="./risk-benchmarks.json";

  // ------------------------------------------------------------- taxonomy
  // The thirteen factors, in tree order. Units: money, probability, frequency.
  // Definitions are written for the drill; the standard's own text lives with
  // its publisher.
  const NODES={
    risk:{abbr:"Risk",name:"Risk",unit:"$",kids:["lef","lm"],
      def:"How often future loss is likely to occur and how large it is likely to be, taken together."},
    lef:{abbr:"LEF",name:"Loss Event Frequency",unit:"#",kids:["tef","susc"],
      def:"How often, within a given timeframe, a threat's actions are expected to actually cause harm to the asset."},
    lm:{abbr:"LM",name:"Loss Magnitude",unit:"$",kids:["pl","sl"],
      def:"How much loss is expected to result from a single loss event."},
    tef:{abbr:"TEF",name:"Threat Event Frequency",unit:"#",kids:["cf","poa"],
      def:"How often a threat is expected to act against the asset in a way that could cause loss, whether or not it succeeds."},
    susc:{abbr:"Susc",name:"Susceptibility",aka:"also called Vulnerability",unit:"%",kids:["tcap","rs"],
      def:"The probability that a threat event becomes a loss event: that the attempt succeeds."},
    pl:{abbr:"PL",name:"Primary Loss",unit:"$",kids:[],
      def:"Loss borne directly by the organisation as an immediate result of the event."},
    sl:{abbr:"SL",name:"Secondary Loss",unit:"$",kids:["slef","slm"],
      def:"Loss that follows from how outside parties react to the event, rather than from the event itself."},
    cf:{abbr:"CF",name:"Contact Frequency",unit:"#",kids:[],
      def:"How often the threat comes into contact with the asset at all."},
    poa:{abbr:"PoA",name:"Probability of Action",unit:"%",kids:[],
      def:"The chance that a threat, once in contact, decides to act against the asset."},
    tcap:{abbr:"TCap",name:"Threat Capability",unit:"%",kids:[],
      def:"How capable the threat is of overcoming the controls that resist it."},
    rs:{abbr:"RS",name:"Resistance Strength",unit:"%",kids:[],
      def:"How well the resisting controls hold up against the range of threats they face."},
    slef:{abbr:"SLEF",name:"Secondary Loss Event Frequency",unit:"%",kids:[],
      def:"The share of loss events expected to draw a reaction from outside parties."},
    slm:{abbr:"SLM",name:"Secondary Loss Magnitude",unit:"$",kids:[],
      def:"How much loss is expected from those outside reactions when they occur."},
  };
  const ROOT="risk";
  const NODE_IDS=Object.keys(NODES);
  const PARENT={};NODE_IDS.forEach(id=>NODES[id].kids.forEach(k=>{PARENT[k]=id;}));
  const FORMS=[
    ["Productivity Loss","Output the organisation fails to deliver because the event disrupted its work."],
    ["Response Costs","What it costs to deal with the event: investigation, containment, recovery, notification."],
    ["Replacement Costs","The cost of repairing or replacing what the event damaged or destroyed."],
    ["Fines and Judgments","Penalties imposed by regulators, and settlements or damages arising from legal action."],
    ["Reputation Damage","Future business and standing lost because of how the event changed perceptions of the organisation."],
    ["Competitive Advantage Loss","Ground ceded to competitors, for instance through leaked strategy or intellectual property."],
  ];
  const SUBS=[
    ["Perceived Value","What the threat believes it stands to gain from acting."],
    ["Level of Effort","How much work the threat expects that acting will take."],
    ["Risk to Threat Agent","The consequences the threat expects to face if it acts."],
  ];
  const CATS={
    factor:{label:"Factor",color:"var(--sage)",soft:"var(--sage-soft)"},
    form:{label:"Form of loss",color:"var(--rose)",soft:"var(--rose-soft)"},
    sub:{label:"PoA sub-factor",color:"var(--plum)",soft:"var(--plum-soft)"},
  };
  const ITEMS=[]
    .concat(NODE_IDS.map(id=>({id:"f:"+id,name:NODES[id].abbr+" · "+NODES[id].name,def:NODES[id].def,cat:"factor",unit:NODES[id].unit})))
    .concat(FORMS.map((f,i)=>({id:"l:"+i,name:f[0],def:f[1],cat:"form"})))
    .concat(SUBS.map((s,i)=>({id:"s:"+i,name:s[0],def:s[1],cat:"sub"})));
  const ITEM={};ITEMS.forEach(it=>{ITEM[it.id]=it;});

  const UNIT={"$":{cls:"money",label:"money"},"%":{cls:"prob",label:"probability"},"#":{cls:"freq",label:"frequency, a count per period"}};
  const SYMBOL={USD:"$",AUD:"A$",CAD:"C$",GBP:"£",EUR:"€"};
  // A published benchmark reports two of the thirteen: how often, and how much.
  const SOURCED={lef:"frequency",lm:"impact"};

  function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=b[i];b[i]=b[j];b[j]=t;}return b;}
  function money(v,ccy){const s=SYMBOL[ccy]||(ccy+" ");if(v>=1e6)return s+(v/1e6).toFixed(1)+"M";if(v>=1e3)return s+Math.round(v/1e3)+"K";return s+Math.round(v);}
  function tidyNum(v){return Number.isInteger(v)?String(v):String(+v.toPrecision(2));}
  function rangeFor(bm,id){
    if(!bm||!SOURCED[id])return null;
    const t=bm[SOURCED[id]];if(!t)return null;
    const f=id==="lm"?v=>money(v,bm.currency):tidyNum;
    return f(t.min)+" / "+f(t.likely)+" / "+f(t.max)+(id==="lm"?" per event":" per year");
  }
  function pctOf(a,b){return b>0?Math.round(a/b*100)+"%":"—";}

  // Tidy layout: leaves get one column each in tree order, every parent sits
  // over the middle of its children. Leaf columns, left to right: CF, PoA,
  // TCap, RS, PL, SLEF, SLM.
  const LAYOUT=(()=>{
    const pos={};let col=0,depth=0;
    function place(id,d){
      depth=Math.max(depth,d);
      const n=NODES[id];
      if(!n.kids.length){pos[id]={x:col++,d};return pos[id].x;}
      const xs=n.kids.map(k=>place(k,d+1));
      pos[id]={x:(xs[0]+xs[xs.length-1])/2,d};
      return pos[id].x;
    }
    place(ROOT,0);
    return {pos,cols:col,levels:depth+1};
  })();

  // ----------------------------------------------------------------- hooks
  function useWidth(ref,fallback){
    const [w,setW]=useState(fallback||800);
    useEffect(()=>{
      const node=ref.current;if(!node)return;
      const read=()=>{const r=node.getBoundingClientRect();if(r.width>0)setW(r.width);};
      read();const raf=requestAnimationFrame(read);
      const ro=typeof ResizeObserver!=="undefined"?new ResizeObserver(read):null;
      if(ro)ro.observe(node);
      window.addEventListener("resize",read);
      return()=>{cancelAnimationFrame(raf);window.removeEventListener("resize",read);if(ro)ro.disconnect();};
    },[ref]);
    return w;
  }

  // ---------------------------------------------------------------- pieces
  function UnitBadge({unit,ask}){
    if(ask)return el('span',{className:"unit ask",title:"unit not yet assigned"},"?");
    const u=UNIT[unit];
    return el('span',{className:"unit "+u.cls,title:u.label},unit);
  }
  function UnitButtons({onPick}){
    return el('span',{className:"ask-units"},["$","%","#"].map(u=>el('button',{key:u,type:"button",className:UNIT[u].cls,onClick:()=>onPick(u),"aria-label":UNIT[u].label},u)));
  }

  // Split a long factor name over two lines for the diagram boxes.
  function wrapName(name,max){
    if(name.length<=max)return [name];
    const words=name.split(" ");let a=[],b=[];
    for(const w of words){if(!b.length&&(a.join(" ")+" "+w).trim().length<=max)a.push(w);else b.push(w);}
    if(!a.length)a=[b.shift()];
    return [a.join(" "),b.join(" ")].filter(Boolean);
  }

  // The tree as a diagram. `describe(id)` says how each factor should look
  // and behave; the diagram only draws.
  function Diagram({width,describe}){
    const colW=width/LAYOUT.cols;
    const roomy=colW>=118;
    const tight=colW<105;
    const nodeW=Math.min(roomy?164:110,colW-10);
    const nodeH=roomy?64:46;
    const gapY=roomy?54:40;
    const top=8;
    const height=top+LAYOUT.levels*nodeH+(LAYOUT.levels-1)*gapY+8;
    const cx=id=>LAYOUT.pos[id].x*colW+colW/2;
    const cy=id=>top+LAYOUT.pos[id].d*(nodeH+gapY)+nodeH/2;
    const edges=[];
    NODE_IDS.forEach(id=>NODES[id].kids.forEach(k=>{
      const x1=cx(id),y1=cy(id)+nodeH/2,x2=cx(k),y2=cy(k)-nodeH/2,ym=(y1+y2)/2;
      edges.push(el('path',{key:id+"-"+k,className:"edge",d:"M"+x1+" "+y1+" C"+x1+" "+ym+","+x2+" "+ym+","+x2+" "+y2}));
    }));
    return el('svg',{className:"diagram"+(tight?" tight":""),viewBox:"0 0 "+width+" "+height,role:"group","aria-label":"FAIR factor tree"},
      edges,
      NODE_IDS.map(id=>{
        const n=NODES[id],d=describe(id);
        const x=cx(id)-nodeW/2,y=cy(id)-nodeH/2;
        const cls="gnode "+d.state+(d.flash?" "+d.flash:"")+(d.selected?" sel":"")+(d.sourced?" sourced":"")+(d.armed?" armed":"")+(d.onClick?" clickable":"");
        const showName=roomy&&d.state!=="slot";
        const lines=showName?wrapName(n.name,Math.floor((nodeW-40)/5.3)):[];
        return el('g',{key:id,className:cls,transform:"translate("+x+","+y+")",
          onClick:d.onClick||null,role:d.onClick?"button":null,tabIndex:d.onClick?0:-1,
          "aria-label":d.state==="slot"?"empty slot":n.abbr+", "+n.name,
          onKeyDown:d.onClick?e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();d.onClick();}}:null},
          el('rect',{className:"box",width:nodeW,height:nodeH,rx:12}),
          d.state==="slot"
            ?el('text',{className:"dots",x:nodeW/2,y:nodeH/2+5,textAnchor:"middle"},"· · ·")
            :[
              el('text',{key:"a",className:"abbr",x:12,y:roomy?25:29},n.abbr),
              ...lines.map((ln,i)=>el('text',{key:"n"+i,className:"nm",x:12,y:41+i*12},ln)),
              d.sourced&&roomy?el('text',{key:"t",className:"tag",x:nodeW-12,y:nodeH-8,textAnchor:"end"},"SOURCED"):null,
              d.unit!==undefined?el('g',{key:"u",className:"ubadge "+(d.unit?UNIT[d.unit].cls:"ask"),transform:"translate("+(nodeW-20)+","+(roomy?20:23)+")"},
                el('circle',{r:10}),el('text',{y:4,textAnchor:"middle"},d.unit||"?")):null
            ]);
      }));
  }

  function Outline({renderRow}){
    function Branch({id}){
      const n=NODES[id];
      return el('li',null,renderRow(id),n.kids.length>0&&el('ul',null,n.kids.map(k=>el(Branch,{key:k,id:k}))));
    }
    return el('ul',{className:"tree"},el(Branch,{id:ROOT}));
  }

  // ------------------------------------------------------------------ walk
  function WalkMode({list,err,sel,setSel,view,width,showDefs}){
    const bm=list.find(b=>b.id===sel)||null;
    const prov=bm&&bm.provenance?Object.keys(bm.provenance):[];
    const [pick,setPick]=useState(ROOT);
    const p=NODES[pick],rng=rangeFor(bm,pick);

    const body=view==="diagram"
      ?el('div',null,
          el(Diagram,{width,describe:id=>({state:"walk",unit:NODES[id].unit,sourced:!!rangeFor(bm,id),selected:id===pick,onClick:()=>setPick(id)})}),
          el('div',{className:"detail","aria-live":"polite"},
            el('div',{className:"head"},
              el('span',{className:"abbr"},p.abbr),el('span',{className:"nm"},p.name),
              p.aka&&el('span',{className:"aka"},"("+p.aka+")"),
              el(UnitBadge,{unit:p.unit}),
              el('span',{className:"ulab"},UNIT[p.unit].label)),
            el('p',null,p.def),
            rng&&el('div',{className:"src"},"Sourced from the loaded benchmark: "+rng),
            el('div',{className:"kids"},
              PARENT[pick]?["Feeds ",el('b',{key:"p"},NODES[PARENT[pick]].abbr)]:"The top of the tree",
              p.kids.length?[" · built from ",...p.kids.map((k,i)=>[i?" and ":"",el('b',{key:k},NODES[k].abbr)])]:" · a leaf: estimated directly, or supplied by data")))
      :el(Outline,{renderRow:id=>{
          const n=NODES[id],r=rangeFor(bm,id);
          return el('div',{className:"row"+(r?" sourced":"")},
            el('span',{className:"abbr"},n.abbr),el('span',{className:"nm"},n.name),
            n.aka&&el('span',{className:"aka"},"("+n.aka+")"),
            el(UnitBadge,{unit:n.unit}),
            r&&el('span',{className:"src"},"sourced · "+r),
            showDefs&&el('span',{className:"def"},n.def));
        }});

    return el('div',null,body,
      el('div',{className:"example"},
        el('div',{style:{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:8}},
          el('b',null,"Worked example"),
          err?el('span',{style:{fontSize:12.5,color:"var(--muted)"}},"benchmarks unavailable ("+err+")")
          :el('select',{className:"field",style:{maxWidth:420},value:sel,"aria-label":"Benchmark to load onto the tree",onChange:e=>setSel(e.target.value)},
            el('option',{value:""},list.length?"Load a source-backed scenario onto the tree":"Loading…"),
            list.map(b=>el('option',{key:b.id,value:b.id},b.label)))),
        bm
          ?el('div',null,
            el('b',null,"2 of 13 factors have a published number. "),
            "A loss study reports how often the event happens and what it costs, which is Loss Event Frequency and Loss Magnitude and nothing below them. Nobody measures contact frequency, probability of action, threat capability or resistance strength across a population. The eleven empty factors are not missing data: they are the analysis, and they are why the decomposition is worth knowing cold.",
            prov.length>0&&el('details',{className:"sources"},
              el('summary',null,"Sources behind the two filled factors ("+prov.length+")"),
              el('ul',null,prov.map(k=>{const pr=bm.provenance[k];return el('li',{key:k},k," — ",pr.url?el('a',{href:pr.url,target:"_blank",rel:"noopener"},pr.source_name||"source"):(pr.source_name||"unattributed"),pr.confidence?" · "+pr.confidence+" confidence":null,pr.limitations?el('div',null,pr.limitations):null);}))))
          :"Pick a scenario and watch how little of the tree it fills. The gap is the lesson."));
  }

  // --------------------------------------------------------------- rebuild
  function RebuildMode({report,view,width}){
    const [pool,setPool]=useState(()=>shuffle(NODE_IDS));
    const [held,setHeld]=useState(null);        // factor picked from the pool
    const [placed,setPlaced]=useState({});      // id -> true
    const [units,setUnits]=useState({});        // id -> unit
    const [asking,setAsking]=useState(null);    // id awaiting a unit
    const [flash,setFlash]=useState({});        // id -> "good" | "bad"
    const [tries,setTries]=useState({place:0,placeOk:0,unit:0,unitOk:0});

    const placedN=Object.keys(placed).length,unitsN=Object.keys(units).length;
    const finished=unitsN>=NODE_IDS.length;
    useEffect(()=>{report({placedN,unitsN,tries,finished});},[placedN,unitsN,tries,finished]);

    function blink(id,kind){
      setFlash(f=>Object.assign({},f,{[id]:kind}));
      setTimeout(()=>setFlash(f=>{const n=Object.assign({},f);delete n[id];return n;}),420);
    }
    function dropOn(slot){
      if(asking||!held||placed[slot])return;
      setTries(t=>Object.assign({},t,{place:t.place+1,placeOk:t.placeOk+(held===slot?1:0)}));
      if(held===slot){
        setPlaced(p=>Object.assign({},p,{[slot]:true}));
        setPool(p=>p.filter(x=>x!==slot));
        setHeld(null);setAsking(slot);blink(slot,"good");
      }else blink(slot,"bad");
    }
    function answerUnit(u){
      if(!asking)return;
      const ok=NODES[asking].unit===u;
      setTries(t=>Object.assign({},t,{unit:t.unit+1,unitOk:t.unitOk+(ok?1:0)}));
      if(ok){setUnits(x=>Object.assign({},x,{[asking]:u}));blink(asking,"good");setAsking(null);}
      else blink(asking,"bad");
    }

    let status,cls="";
    if(finished){status="Every factor is placed and every unit is right. Rebuild it again until it is boring.";cls="good";}
    else if(asking){status="Which unit does "+NODES[asking].abbr+" ("+NODES[asking].name+") carry?";cls="hot";}
    else if(held){status="Where does "+NODES[held].abbr+" ("+NODES[held].name+") sit? Tap the slot.";}
    else status="Pick a factor from the pool, then tap the slot where it belongs.";

    const tree=view==="diagram"
      ?el(Diagram,{width,describe:id=>{
          if(!placed[id])return {state:"slot",armed:!!held&&!asking,flash:flash[id],onClick:()=>dropOn(id)};
          return {state:units[id]?"done":"placed",unit:units[id]||"",flash:flash[id]};
        }})
      :el(Outline,{renderRow:id=>{
          const n=NODES[id],fl=flash[id]||"";
          if(!placed[id]){
            const armed=!!held&&!asking;
            return el('div',{className:"row slot"+(armed?" armed":"")+(fl?" "+fl:""),role:"button",tabIndex:armed?0:-1,
              onClick:()=>dropOn(id),onKeyDown:e=>{if(e.key==="Enter"||e.key===" ")dropOn(id);},"aria-label":"empty slot"},"· · ·");
          }
          const done=!!units[id];
          return el('div',{className:"row "+(done?"done":"placed")+(fl?" "+fl:"")},
            el('span',{className:"abbr"},n.abbr),el('span',{className:"nm"},n.name),
            done?el(UnitBadge,{unit:units[id]}):el(UnitBadge,{ask:true}),
            asking===id&&el('span',{className:"ask-units"},el('span',null,"unit?"),el(UnitButtons,{onPick:answerUnit})));
        }});

    return el('div',null,
      el('div',{className:"status "+cls},el('span',null,status),asking&&view==="diagram"&&el(UnitButtons,{onPick:answerUnit})),
      !finished&&el('div',{className:"pool","aria-label":"Factors still to place"},
        pool.length?pool.map(id=>el('button',{key:id,type:"button",className:"chip"+(held===id?" on":""),disabled:!!asking,onClick:()=>setHeld(h=>h===id?null:id)},NODES[id].abbr,el('small',null,NODES[id].name)))
        :el('span',{className:"empty"},"All placed. Finish the units.")),
      tree,
      finished&&el('div',{className:"finish"},
        el('div',null,el('b',null,"Tree rebuilt"),el('span',null,"Placement "+pctOf(tries.placeOk,tries.place)+" first-time right · units "+pctOf(tries.unitOk,tries.unit)))));
  }

  // ----------------------------------------------------------------- match
  function MatchMode({report}){
    const [names,setNames]=useState(()=>shuffle(ITEMS.map(i=>i.id)));
    const [cards]=useState(()=>shuffle(ITEMS.map(i=>i.id)));
    const [held,setHeld]=useState(null);
    const [matched,setMatched]=useState({});
    const [flash,setFlash]=useState({});
    const [tries,setTries]=useState({n:0,ok:0});
    const matchedN=Object.keys(matched).length;
    const finished=matchedN>=ITEMS.length;
    useEffect(()=>{report({matchedN,tries,finished});},[matchedN,tries,finished]);

    function blink(id,kind){
      setFlash(f=>Object.assign({},f,{[id]:kind}));
      setTimeout(()=>setFlash(f=>{const n=Object.assign({},f);delete n[id];return n;}),420);
    }
    function pick(card){
      if(!held||matched[card])return;
      const ok=held===card;
      setTries(t=>({n:t.n+1,ok:t.ok+(ok?1:0)}));
      if(ok){setMatched(m=>Object.assign({},m,{[card]:true}));setNames(ns=>ns.filter(x=>x!==held));setHeld(null);blink(card,"good");}
      else blink(card,"bad");
    }

    return el('div',null,
      el('div',{className:"status "+(finished?"good":held?"hot":"")},
        finished?"All twenty-two matched.":held?"Now tap the definition of "+ITEM[held].name+".":"Tap a name on the left, then the definition it belongs to."),
      el('div',{className:"match"},
        el('div',{className:"names","aria-label":"Names still to match"},
          names.length?names.map(id=>el('button',{key:id,type:"button",className:"chip"+(held===id?" on":""),onClick:()=>setHeld(h=>h===id?null:id)},ITEM[id].name))
          :el('span',{style:{fontSize:12.5,color:"var(--muted)"}},"Nothing left to place.")),
        el('div',{className:"defs"},cards.map(id=>{
          const it=ITEM[id],isM=!!matched[id],fl=flash[id]||"",c=CATS[it.cat];
          return el('div',{key:id,className:"defcard"+(isM?" matched":"")+(fl?" "+fl:""),
            style:isM?{borderColor:c.color}:null,
            role:"button",tabIndex:isM?-1:0,onClick:()=>pick(id),onKeyDown:e=>{if(e.key==="Enter"||e.key===" ")pick(id);}},
            isM&&el('div',{className:"who"},
              el('span',{style:{color:c.color}},it.name),
              it.unit&&el(UnitBadge,{unit:it.unit}),
              el('span',{className:"cat",style:{background:c.soft,color:c.color}},c.label)),
            el('div',{className:"txt"},"“"+it.def+"”"));
        }))),
      finished&&el('div',{className:"finish"},
        el('div',null,el('b',null,"Definitions matched"),el('span',null,pctOf(tries.ok,tries.n)+" of taps were right on the first try."))));
  }

  // ----------------------------------------------------------------- notes
  function Notes(){
    return el('section',{className:"wrap notes"+(EMBEDDED?" embedded":""),"aria-label":"Notes"},
      el('div',{className:"note"},el('h3',null,"Why the units matter"),
        el('p',null,"The tree is a calculation, not a diagram. Frequencies multiply by probabilities to make smaller frequencies; a frequency times a magnitude is an expected loss. If you cannot say what unit a factor carries you cannot say what arithmetic connects it to its parent, and an estimate with the wrong unit is not wrong by a little.")),
      el('div',{className:"note"},el('h3',null,"Why two fill and eleven do not"),
        el('p',null,"Published loss data lives at exactly two nodes: how often an event type occurs, and what it tends to cost. Everything beneath them is specific to one organisation's assets, threats and controls, which is why no survey can supply it. Learning the tree is learning where your own judgement has to enter, and where a citation can do the work instead.")),
      el('div',{className:"note"},el('h3',null,"What to do with it"),
        el('p',null,"Rebuild until you stop hesitating, then use the tree the way it is meant to be used: decompose a scenario only as far down as you have something to say. Estimating Loss Event Frequency directly is legitimate when you have incident data; splitting it into contact, action and susceptibility is for when you do not.")));
  }

  // ------------------------------------------------------------------- app
  const MODES=[
    {id:"walk",title:"Walk the tree",blurb:"Every factor with its name and unit. Tap one for its definition, or switch to the outline to read them all. Load a benchmark to see which two get a published number."},
    {id:"rebuild",title:"Rebuild it",blurb:"The tree comes back empty. Place all thirteen factors from a shuffled pool, then give each its unit."},
    {id:"match",title:"Match definitions",blurb:"Twenty-two definitions, twenty-two names: the factors, the six forms of loss and the three sub-factors of Probability of Action."},
  ];

  function App(){
    const [mode,setMode]=useState("walk");
    const [round,setRound]=useState(0);      // bumps the key so a drill restarts fresh
    const [viewPref,setViewPref]=useState("diagram");
    const [showDefs,setShowDefs]=useState(true);
    const [list,setList]=useState([]);
    const [err,setErr]=useState(null);
    const [sel,setSel]=useState("");
    const [prog,setProg]=useState({});
    const panelRef=useRef(null);
    const panelW=useWidth(panelRef,900);
    // Seven leaf columns need room; below that the outline takes over.
    const diagramFits=panelW>=560;
    const view=diagramFits?viewPref:"outline";
    const drawW=Math.max(300,panelW-36);

    useEffect(()=>{
      let live=true;
      fetch(BENCHMARKS_URL).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
        .then(d=>{if(live)setList(Array.isArray(d.benchmarks)?d.benchmarks:[]);})
        .catch(e=>{if(live)setErr(e.message);});
      return()=>{live=false;};
    },[]);
    function choose(id){setMode(id);setRound(r=>r+1);setProg({});}

    let progress=null;
    if(mode==="walk")progress=[["13","factors"],["6 + 3","forms of loss, PoA sub-factors"]];
    else if(mode==="rebuild")progress=[[(prog.placedN||0)+"/13","placed · "+(prog.tries?pctOf(prog.tries.placeOk,prog.tries.place):"—")+" right"],[(prog.unitsN||0)+"/13","units · "+(prog.tries?pctOf(prog.tries.unitOk,prog.tries.unit):"—")+" right"]];
    else progress=[[(prog.matchedN||0)+"/22","matched"],[prog.tries?pctOf(prog.tries.ok,prog.tries.n):"—","first-try accuracy"]];

    const current=MODES.find(m=>m.id===mode);

    return el('div',null,
      !EMBEDDED&&el('header',{className:"wrap masthead"},
        el('div',{className:"kicker"},"RootCaws · Risk lab"),
        el('h1',null,"FAIR Taxonomy ",el('em',null,"Drill")),
        el('p',{className:"deck"},"Thirteen factors, three units, one tree. Walk it with the labels on, rebuild it with them off, and finish by matching every definition to its name. The point is not the diagram. It is being able to think in it without looking it up.")),
      el('div',{className:"wrap bench"},
        el('aside',{className:"card controls","aria-label":"Drill controls"},
          el('div',{className:"label"},"Mode"),
          el('div',{className:"modes",role:"tablist"},MODES.map(m=>el('button',{key:m.id,type:"button",role:"tab","aria-selected":mode===m.id,className:mode===m.id?"on":"",onClick:()=>choose(m.id)},el('b',null,m.title),el('span',null,m.blurb)))),
          mode!=="match"&&el('div',null,
            el('div',{className:"rule"}),
            el('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}},
              el('span',{className:"label"},"View"),
              el('div',{className:"seg",role:"tablist","aria-label":"Tree view"},
                el('button',{type:"button",className:view==="diagram"?"on":"",disabled:!diagramFits,onClick:()=>setViewPref("diagram"),title:diagramFits?null:"Needs a wider screen"},"Diagram"),
                el('button',{type:"button",className:view==="outline"?"on":"",onClick:()=>setViewPref("outline")},"Outline")))),
          el('div',{className:"rule"}),
          el('div',{className:"label",style:{marginBottom:8}},mode==="walk"?"On the board":"Progress"),
          el('div',{className:"progress"},progress.map((p,i)=>el('div',{key:i,className:"cell"},el('div',{className:"v"},p[0]),el('div',{className:"k"},p[1])))),
          el('div',{className:"rule"}),
          el('div',{className:"label",style:{marginBottom:8}},"Units"),
          el('div',{className:"legend"},
            el('div',null,el(UnitBadge,{unit:"$"}),"money: a loss, in currency"),
            el('div',null,el(UnitBadge,{unit:"%"}),"probability, or a share of events"),
            el('div',null,el(UnitBadge,{unit:"#"}),"frequency: a count per period")),
          el('div',{className:"rule"}),
          el('div',{style:{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",justifyContent:"space-between"}},
            mode==="walk"&&view==="outline"
              ?el('button',{type:"button",className:"btn ghost small",onClick:()=>setShowDefs(s=>!s)},showDefs?"Hide definitions":"Show definitions")
              :mode==="walk"
                ?el('span',{style:{fontSize:12,color:"var(--muted)"}},"Tap a factor in the diagram to read its definition.")
                :el('button',{type:"button",className:"btn ghost small",onClick:()=>choose(mode)},"Start over"))),
        el('section',{"aria-label":"Drill"},
          el('div',{className:"card panel",ref:panelRef},
            el('div',{className:"panel-head"},el('h2',null,current.title)),
            el('p',{className:"lede"},current.blurb),
            mode==="walk"&&el(WalkMode,{list,err,sel,setSel,view,width:drawW,showDefs}),
            mode==="rebuild"&&el(RebuildMode,{key:"r"+round,report:setProg,view,width:drawW}),
            mode==="match"&&el(MatchMode,{key:"m"+round,report:setProg})))),
      el(Notes));
  }

  // Embedded in the portfolio risk lab, which is on another origin and cannot
  // measure this document. Report the page height so the frame can fit it.
  if(EMBEDDED){
    let lastHeight=0;
    const reportHeight=()=>{const h=Math.ceil(document.documentElement.getBoundingClientRect().height);if(h>0&&h!==lastHeight){lastHeight=h;window.parent.postMessage({type:"risk-lab:height",height:h},"*");}};
    if(typeof ResizeObserver!=="undefined")new ResizeObserver(reportHeight).observe(document.body);
    window.addEventListener("load",reportHeight);
    setTimeout(reportHeight,0);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(el(App));
  </script>
</body>
</html>
